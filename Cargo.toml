[package]
name = "devToolkit"
version = "0.3.0"
edition = "2024"
authors = ["Khan.Lau <khan.lau@hotmail.com>"]
license = "MIT"
build = "build.rs"

[build-dependencies]
embed-resource = "3.0" # 嵌入 Windows 应用图标 (rc.exe / windres)

[dependencies]
blake2 = "0.10"
blake3 = "1"
chrono = "0.4.45"
crc = "3"            # CRC 校验 (8/16/32/64)
digest = "0.10"      # 哈希核心抽象 (HMAC 泛型依赖)
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
encoding_rs = "0.8.35"
hmac = "0.12"        # HMAC 消息认证码
md-5 = "0.10"        # MD5 哈希
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"        # SHA-1 哈希
sha2 = "0.10"        # SHA-224/256/384/512 哈希

[package.metadata.bundle]
# name = "devToolkit"
identifier = "com.khan.devToolkit.devToolkit"
icon = ["res/app.icns"]

[package.metadata.bundle.macOS]
minimum_system_version = "10.13"

# 发布配置
[profile.release]
opt-level = "z"   # 最小化优化
lto = "fat"       # 开启 fat LTO
codegen-units = 1 # 生成一个代码单元
panic = "abort"   # 开启 panic 时 abort
strip = true      # 去掉调试信息
